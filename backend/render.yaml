services:
  - type: web
    name: kewinchem-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Migrations are additive and idempotent; running them here keeps code and schema in step.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SAMPLE_REQUEST_TO
        sync: false
      - key: INQUIRY_TO
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
